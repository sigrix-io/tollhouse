[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tollhouse"
version = "0.0.1"
description = "Check an MCP server's tools before you install or publish it. This first release reads a tools/list answer for prompt-injection phrases, string by string, the way a model reads it."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Sigrix" }]
keywords = ["mcp", "model-context-protocol", "security", "prompt-injection", "tool-poisoning", "ai-agents"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
# The standard library only, so `uvx tollhouse check` installs one package.
# PyYAML is read lazily by the YAML reading in the rules, which no 0.0.1
# command makes; the `yaml` extra is for a caller that does.
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
dev = [
    "pytest>=8",
    # The version the Sigrix platform formats the copied rules with
    # (CONTRIBUTING.md § Rules); Dependabot moves it, on a pull request of its own.
    "ruff==0.17.6",
    # The other Sigrix packages' pin, for the same reason: a floating checker turns
    # its own release into a red build on a commit that changed nothing.
    "mypy==2.4.1",
    # The stubs for the PyYAML the rules import when a YAML document is read.
    "types-PyYAML>=6.0",
]

[project.scripts]
tollhouse = "tollhouse.cli:main"

[project.urls]
Homepage = "https://github.com/sigrix-io/tollhouse"
Issues = "https://github.com/sigrix-io/tollhouse/issues"
Changelog = "https://github.com/sigrix-io/tollhouse/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/tollhouse"]

[tool.hatch.build.targets.sdist]
include = ["src/tollhouse", "tests", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]
# The pin guard reads .github/workflows, which the sdist does not carry: it
# checks the repository, not the package.
exclude = ["tests/test_workflow_pins.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603"]

# py.typed ships in the wheel, which tells every consumer's type checker to
# trust these annotations, so they are checked as strictly as the other Sigrix
# packages check theirs, the copied rules included.
[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/tollhouse"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
