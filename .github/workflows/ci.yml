name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        # A finding quotes the text it matched, and a Windows pipe's encoding
        # is not UTF-8, so the command runs there once too.
        include:
          - os: windows-latest
            python-version: "3.13"
    steps:
      # Checks out, installs the Python and pip-installs `-e .[dev]`, with the
      # upstream actions pinned once in sigrix-io/actions rather than here.
      - uses: sigrix-io/actions/setup-python-project@765103f1c9d89e019dcaea72a78eed2577b30ae1 # v1.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # The rules are copied from the Sigrix platform as its formatter wrote
      # them, so the dev extra pins ruff to the version the platform runs: a
      # newer one formatting differently would fail this step on a commit
      # that changed nothing.
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest -q
      - name: The console script answers
        run: tollhouse --version && tollhouse check tests/clean_tools.json

  # The aggregate gate. One check to require on main, so adding a job or an
  # operating system above does not mean editing the branch ruleset to match.
  ci-passed:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
