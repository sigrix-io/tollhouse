name: Release

# Trusted publishing: PyPI trusts this repository's `release.yml` in the
# `pypi` environment, so no API token is stored anywhere and nothing here
# reads a secret. Both sides of that trust have to exist before the first
# tag: the publisher on PyPI and the environment in this repository's
# settings. VERSIONING.md § Releasing has the two of them.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Never cancelled: a run cancelled mid-upload can leave a release half-landed,
# and a PyPI version number can never be reused.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A fork can push a tag to itself; it must not build what this
    # repository's trust policy would then be asked to publish.
    if: github.repository == 'sigrix-io/tollhouse'
    steps:
      - uses: sigrix-io/actions/setup-python-project@765103f1c9d89e019dcaea72a78eed2577b30ae1 # v1.0.0
        with:
          python-version: "3.12"
          install: build
      - name: Build sdist and wheel
        run: python -m build
      - name: The tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Pinned to a commit: this step holds the upload identity, and
      # `release/v1` is a branch, so what ran could change with nothing here
      # recording it.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
